default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: 1
      polling_interval: 0.1

development:
  <<: *default

production:
  <<: *default
  workers:
    - queues: [default, critical]
      threads: 5
      processes: 2
      polling_interval: 0.1
    - queues: [ai_analysis, scheduled]
      threads: 2
      processes: 1
      polling_interval: 5
