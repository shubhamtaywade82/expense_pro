services:
  web:
    build: .
    command: ./bin/thrust ./bin/rails server
    ports:
      - "3000:3000"
    depends_on:
      - db
      - itr_service
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/expense_pro_production
      - RAILS_ENV=production
      - ITR_SERVICE_URL=http://itr_service:8000

  worker:
    build: .
    command: ./bin/jobs
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/expense_pro_production
      - RAILS_ENV=production

  itr_service:
    build: ./itr_service
    ports:
      - "8000:8000"
    environment:
      - COPILOT_ROOT=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./itr_service/rules:/app/rules:ro

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=password
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
